{% extends 'base.html' %}

{% block content %}

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-4 text-center">Job Application Tracker</h1>

            <form action="{% url 'add_job' %}" method="POST">
                {% csrf_token %}
              <div class="mb-3">
                <label for="companyName" class="form-label">Company Name</label>
                <input type="text" class="form-control" name="comapanyname" id="companyName" placeholder="Enter company name">
              </div>

              <div class="mb-3">
                <label for="jobTitle" class="form-label">Job Title</label>
                <input type="text" class="form-control" name="jobtitle" id="jobTitle" placeholder="Enter job title">
              </div>

              <div class="mb-3">
                <label for="location" class="form-label">Location</label>
                <input type="text" class="form-control" name="location" id="location" placeholder="Enter Location">
              </div>

              <div class="mb-3">
                <label for="Desgination" class="form-label">Desgination</label>
                <input type="text" class="form-control" name="desgination" id="Desgination" placeholder="Enter Desgination">
              </div>

              <div class="mb-3">
                <label for="salary" class="form-label" step="0.01" min="0" required>Salary</label>
                <input type="number" class="form-control" name="salary" id="salary" placeholder="Enter Annual Salary">
              </div>

              <div class="mb-3">
                <label for="applicationDate" class="form-label">Application Date</label>
                <input type="date" class="form-control" name="applicationdate" id="applicationDate">
              </div>
              
              <div class="mb-3">
                <label class="form-label d-block">Status</label>
                <div class="btn-group" role="group" aria-label="Job status">
                  <input type="radio" class="btn-check" name="status" id="applied" value="Applied" autocomplete="off">
                  <label class="btn btn-outline-primary" for="applied">Applied</label>

                  <input type="radio" class="btn-check" name="status" id="interview" value="Interview" autocomplete="off">
                  <label class="btn btn-outline-primary" for="interview">Interview</label>

                  <input type="radio" class="btn-check" name="status" id="selected" value="Selected" autocomplete="off">
                  <label class="btn btn-outline-primary" for="selected">Selected</label>

                  <input type="radio" class="btn-check" name="status" id="joined" value="Joined" autocomplete="off">
                  <label class="btn btn-outline-primary" for="joined">Joined</label>

                  <input type="radio" class="btn-check" name="status" id="rejected" value="Rejected" autocomplete="off">
                  <label class="btn btn-outline-primary" for="rejected">Rejected</label>
                </div>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

{% endblock %}
